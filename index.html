function initNotes(){const L=$('#nlist'),ti=$('#ti'),bo=$('#bo'),q=$('#nq');if(!L)return;
const me=()=>NB.find(z=>z.id==cur),wc=s=>(s.trim()?s.trim().split(/\s+/).length:0)+' words · saved',
list=()=>{const s=q.value.toLowerCase();L.innerHTML=NB.filter(n=>(n.t+n.b).toLowerCase().includes(s)).sort((a,b)=>b.pin-a.pin||b.ts-a.ts).map(n=>`<div class="ni${n.id==cur?' on':''}" data-id="${n.id}" style="--c:${NC[n.c]}"><b>${n.pin?'📌 ':''}${esc(n.t||'Untitled')}</b><small>${esc((n.b||'').slice(0,50))}</small></div>`).join('')||'<div class="empty">No notes found.</div>'},
open=id=>{const n=NB.find(z=>z.id==id);if(!n)return;cur=id;ti.value=n.t;bo.value=n.b;$('#wc').textContent=wc(n.b);$('#np').textContent=n.pin?'Unpin':'Pin';$('.pp').style.setProperty('--c',NC[n.c]);list()},
add=()=>{const n={id:Date.now(),t:'',b:'',c:Math.random()*6|0,pin:0,ts:Date.now()};NB.unshift(n);nbs();q.value='';open(n.id);ti.focus();sfx('spark')},
ed=()=>{const n=me();if(!n)return;n.t=ti.value;n.b=bo.value;n.ts=Date.now();nbs();$('#wc').textContent=wc(n.b);list()};
ti.oninput=bo.oninput=()=>{ed();sfx('write')};q.oninput=list;$('#nn').onclick=add;
L.onclick=e=>{const i=e.target.closest('.ni');if(i)open(i.dataset.id)};
$('#nc').onclick=e=>{const i=e.target.closest('i'),n=me();if(i&&n){n.c=+i.dataset.c;nbs();open(n.id)}};
$('#np').onclick=()=>{const n=me();n.pin=n.pin?0:1;nbs();open(n.id)};
$('#ne').onclick=()=>{const n=me(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([(n.t||'Untitled')+'\n\n'+n.b],{type:'text/plain'}));a.download=(n.t||'note').replace(/\W+/g,'-')+'.txt';a.click();toast('Exported')};
$('#nd').onclick=()=>{if(confirm('Delete this note?')){NB=NB.filter(z=>z.id!=cur);nbs();NB.length?open(NB[0].id):add()}};
if(NB.length)open(NB.some(z=>z.id==cur)?cur:NB[0].id);else add()}
function hooks(k){if(k=='cake')initCake();if(k=='notes')initNotes()}
mu();

paint(0);
</script></body></html>
